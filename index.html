<!DOCTYPE html>
<html>
<head>
    <title>Spotify Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="page-title">Top Tracks</h1>

    <div class="tabs">
        <button class="tab-button active" id="tab-tracks">Top Tracks</button>
        <button class="tab-button" id="tab-genres">Top Genres</button>
    </div>

    <div class="controls">
        <label>
            Show:
            <select id="limit-select">
                <option value="5">Top 5</option>
                <option value="10" selected>Top 10</option>
                <option value="25">Top 25</option>
                <option value="50">Top 50</option>
            </select>
        </label>

        <label>
            <input type="checkbox" id="all-time-checkbox" checked>
            All time
        </label>

        <label>
            Last:
            <input type="number" id="amount-input" value="30" min="1" disabled>
        </label>

        <select id="unit-select" disabled>
            <option value="days" selected>Days</option>
            <option value="months">Months</option>
            <option value="years">Years</option>
        </select>
    </div>

    <table id="results-table">
        <thead id="results-head">
            <tr>
                <th>Track</th>
                <th>Artist</th>
                <th>Plays</th>
            </tr>
        </thead>
        <tbody id="results-body">
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
