<!DOCTYPE html>
<html>
<head>
    <title>Spotify Analytics</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: white;
            padding: 40px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .tab-button {
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab-button.active {
            background: #1DB954;
            color: black;
            border-color: #1DB954;
            font-weight: bold;
        }
        .controls {
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        select {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 4px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 700px;
        }
        th, td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #333;
        }
        th {
            color: #1DB954;
        }
    </style>
</head>
<body>
    <h1 id="page-title">Top Tracks</h1>

    <div class="tabs">
        <button class="tab-button active" id="tab-tracks">Top Tracks</button>
        <button class="tab-button" id="tab-genres">Top Genres</button>
    </div>

    <div class="controls">
        <label>
            Show:
            <select id="limit-select">
                <option value="5">Top 5</option>
                <option value="10" selected>Top 10</option>
                <option value="25">Top 25</option>
                <option value="50">Top 50</option>
            </select>
        </label>

        <label>
            Time range:
            <select id="range-select">
                <option value="30days">Last 30 days</option>
                <option value="6months">Last 6 months</option>
                <option value="year">Last year</option>
                <option value="all" selected>All time</option>
            </select>
        </label>
    </div>

    <table id="results-table">
        <thead id="results-head">
            <tr>
                <th>Track</th>
                <th>Artist</th>
                <th>Plays</th>
            </tr>
        </thead>
        <tbody id="results-body">
        </tbody>
    </table>

    <script>
        const limitSelect = document.getElementById("limit-select");
        const rangeSelect = document.getElementById("range-select");
        const resultsBody = document.getElementById("results-body");
        const resultsHead = document.getElementById("results-head");
        const pageTitle = document.getElementById("page-title");
        const tabTracks = document.getElementById("tab-tracks");
        const tabGenres = document.getElementById("tab-genres");

        // Tracks which tab is currently active. Starts on "tracks".
        let activeView = "tracks";

        function setActiveTab(view) {
            activeView = view;

            // Toggle the "active" CSS class so the right button is highlighted
            tabTracks.classList.toggle("active", view === "tracks");
            tabGenres.classList.toggle("active", view === "genres");

            if (view === "tracks") {
                pageTitle.textContent = "Top Tracks";
                resultsHead.innerHTML = `
                    <tr>
                        <th>Track</th>
                        <th>Artist</th>
                        <th>Plays</th>
                    </tr>
                `;
            } else {
                pageTitle.textContent = "Top Genres";
                resultsHead.innerHTML = `
                    <tr>
                        <th>Genre</th>
                        <th>Plays</th>
                    </tr>
                `;
            }

            loadResults();
        }

        function loadResults() {
            const limit = limitSelect.value;
            const range = rangeSelect.value;

            const endpoint = activeView === "tracks" ? "top-tracks" : "top-genres";
            const url = `http://127.0.0.1:5001/api/${endpoint}?limit=${limit}&range=${range}`;

            fetch(url)
                .then(response => response.json())
                .then(rows => {
                    resultsBody.innerHTML = "";

                    rows.forEach(row => {
                        const tr = document.createElement("tr");

                        if (activeView === "tracks") {
                            tr.innerHTML = `
                                <td>${row.track_name}</td>
                                <td>${row.artist_name}</td>
                                <td>${row.play_count}</td>
                            `;
                        } else {
                            tr.innerHTML = `
                                <td>${row.genre}</td>
                                <td>${row.play_count}</td>
                            `;
                        }

                        resultsBody.appendChild(tr);
                    });
                });
        }

        tabTracks.addEventListener("click", () => setActiveTab("tracks"));
        tabGenres.addEventListener("click", () => setActiveTab("genres"));
        limitSelect.addEventListener("change", loadResults);
        rangeSelect.addEventListener("change", loadResults);

        loadResults();  // load once immediately on page open
    </script>
</body>
</html>
